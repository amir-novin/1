<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قیمت لحظه‌ای طلا</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #b8860b, #f2c94c);
      color: white;
      text-align: center;
      padding: 35px 15px;
      box-shadow: 0 3px 10px #0002;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    #updated {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      border-right: 5px solid #d4a017;
      box-shadow: 0 5px 18px #00000012;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h2 {
      margin: 0 0 18px;
      color: #8a6500;
      font-size: 18px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #222;
    }

    .unit {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
    }

    .message {
      background: #fff3cd;
      color: #856404;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin: 40px 0 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>قیمت لحظه‌ای طلا</h1>
  </header>

  <main class="container">
    <div id="updated">در حال دریافت قیمت‌ها...</div>
    <div id="prices" class="grid"></div>
  </main>

  <footer>
    توسعه داده شده توسط امیر مهدی نوین
  </footer>

  <script>
    const pricesBox = document.getElementById("prices");
    const updatedBox = document.getElementById("updated");

    function formatPrice(price) {
      return Number(price).toLocaleString("fa-IR");
    }

    async function loadPrices() {
      try {
        const response = await fetch("data.json?time=" + Date.now());

        if (!response.ok) {
          throw new Error("خطا در دریافت اطلاعات");
        }

        const data = await response.json();

        updatedBox.textContent =
          "آخرین بروزرسانی: " + (data.updated_at || "نامشخص");

        pricesBox.innerHTML = "";

        data.prices.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";

          const title = document.createElement("h2");
          title.textContent = item.title;

          const price = document.createElement("div");
          price.className = "price";
          price.textContent = formatPrice(item.price);

          const unit = document.createElement("div");
          unit.className = "unit";
          unit.textContent = item.unit;

          card.appendChild(title);
          card.appendChild(price);
          card.appendChild(unit);

          pricesBox.appendChild(card);
        });

      } catch (error) {
        pricesBox.innerHTML = `
          <div class="message">
            دریافت قیمت‌ها با خطا مواجه شد.
          </div>
        `;
      }
    }

    loadPrices();

    // بروزرسانی نمایش اطلاعات هر ۵ دقیقه
    setInterval(loadPrices, 300000);
  </script>

</body>
</html>
