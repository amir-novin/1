<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قیمت طلا و سکه</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #b8860b, #f5c542);
      color: white;
      padding: 30px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .info {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      box-shadow: 0 5px 18px #00000012;
      border-right: 5px solid #d4a017;
    }

    .card h2 {
      margin: 0 0 15px;
      font-size: 18px;
      color: #8a6500;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #222;
    }

    .unit {
      color: #777;
      font-size: 13px;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      margin: 35px 0 20px;
      color: #777;
      font-size: 13px;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>قیمت لحظه‌ای طلا و سکه</h1>
  <div>منبع اطلاعات: tala.ir</div>
</header>

<div class="container">
  <div class="info" id="updated">در حال دریافت اطلاعات...</div>
  <div class="grid" id="prices"></div>
</div>

<footer>
  این وب‌سایت مستقل است و وابسته به سایت tala.ir نیست.
</footer>

<script>
  async function loadPrices() {
    const pricesBox = document.getElementById("prices");
    const updatedBox = document.getElementById("updated");

    try {
      const response = await fetch("data.json?time=" + Date.now());

      if (!response.ok) {
        throw new Error("خطا در دریافت اطلاعات");
      }

      const data = await response.json();

      updatedBox.textContent =
        "آخرین بروزرسانی: " + (data.updated_at || "نامشخص");

      pricesBox.innerHTML = "";

      data.prices.forEach(item => {
        pricesBox.innerHTML += `
          <div class="card">
            <h2>${item.title}</h2>
            <div class="price">${item.price}</div>
            <div class="unit">${item.unit || "تومان"}</div>
          </div>
        `;
      });

    } catch (error) {
      pricesBox.innerHTML = `
        <div class="error">
          دریافت قیمت‌ها با خطا مواجه شد.
        </div>
      `;
    }
  }

  loadPrices();

  // بروزرسانی هر ۵ دقیقه
  setInterval(loadPrices, 300000);
</script>

</body>
</html>
