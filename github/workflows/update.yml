name: Update Gold Prices

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: دریافت قیمت‌ها
        run: python update_prices.py

      - name: ذخیره قیمت‌های جدید
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Update gold prices" || exit 0
          git push
